# fly.toml app configuration file generated for rubbermagnolia on 2026-09-08T21:30:36+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rubbermagnolia'
primary_region = 'lhr'
kill_signal = 'SIGTERM'

[build]
[env]
  DATABASE_PATH = '/data/mag_sked.db'
  PHX_HOST = 'rubbermagnolia.fly.dev'
  PORT = '8080'
  POOL_SIZE = '5'

[[mounts]]
  source = 'mag_sked_data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
